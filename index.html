<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f6fff"><meta name="apple-mobile-web-app-capable" content="yes"><title>KINTAI MOBILE DEMO</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"></head><body><div class="app"><header><div><small>MOBILE DEMO</small><h1>KINTAI</h1></div><button id="reset">↻</button></header><main><section id="home" class="view active"><div class="status"><div id="date"></div><div id="clock">--:--:--</div><div class="chips"><span id="workState">未出勤</span><span id="gpsState">GPS 未取得</span></div></div><div class="punches"><button id="in" class="punch in">☀<b>出勤</b><small>現在地を記録</small></button><button id="out" class="punch out" disabled>☾<b>退勤</b><small>現在地を記録</small></button></div><div class="quick"><button data-nav="history">🕘<b>勤務履歴</b></button><button data-nav="requests">📝<b>各種申請</b></button></div><div class="panel"><h2>本日の勤務</h2><div class="stats"><div><small>出勤</small><b id="todayIn">--:--</b></div><div><small>退勤</small><b id="todayOut">--:--</b></div><div><small>勤務</small><b id="todayWork">0:00</b></div></div></div><div class="panel"><h2>直近の打刻</h2><div id="logs"></div></div></section><section id="history" class="view"><div class="head"><h2>勤務履歴</h2><button id="sample">デモ追加</button></div><div id="historyList"></div></section><section id="requests" class="view"><h2>各種申請</h2><form id="requestForm" class="panel"><label>申請種別<select id="type"><option>有給休暇</option><option>午前半休</option><option>午後半休</option><option>打刻修正</option><option>残業申請</option></select></label><label>対象日<input id="reqDate" type="date" required></label><label>理由<textarea id="reason" rows="3"></textarea></label><button type="submit" class="submit">申請する</button></form><div id="requestList"></div></section><section id="settings" class="view"><h2>デモ設定</h2><div class="panel settings"><p><b>GPS打刻</b><span>ON</span></p><p><b>保存先</b><span>端末内</span></p><p><b>オフライン</b><span>対応</span></p><p class="note">iPhone: Safari → 共有 → ホーム画面に追加<br>Android: Chrome → アプリをインストール</p><button id="install" class="submit secondary" hidden>この端末にインストール</button></div></section></main><nav><button class="active" data-nav="home">⌂<small>ホーム</small></button><button data-nav="history">◷<small>履歴</small></button><button data-nav="requests">✎<small>申請</small></button><button data-nav="settings">⚙<small>設定</small></button></nav></div><div id="toast"></div><script src="app.js"></script></body></html>
